name: Alpha release

on:
  push:
    tags:
      - 'v*-alpha.*'

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate
        run: |
          npm run check
          npm test
      - name: Package portable app
        run: python3 scripts/package-release.py --output dist/XTemplate-Studio-${{ github.ref_name }}.zip
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "dist/XTemplate-Studio-$TAG.zip" \
            --title "XTemplate Studio $TAG (Alpha)" \
            --notes-file RELEASE_NOTES.md \
            --prerelease \
            --verify-tag

  appimage:
    permissions:
      contents: write
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Install JS dependencies
        run: npm ci
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run desktop:build
      - name: Attach AppImage to prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" src-tauri/target/release/bundle/appimage/*.AppImage --clobber

name: Checks

on:
  push:
    branches: [main, 'refactor/**', 'feat/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Check distributable
        run: python3 scripts/package-release.py --output /tmp/XTemplate-Studio-test.zip
